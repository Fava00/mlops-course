# Week 2 Lab — Local Services Stack (starter)
#
#   postgres             relational backend store — params, metrics, tags
#   s3                   object store — model files and plots
#   s3-create-bucket     one-shot job that creates the artifacts bucket
#   mlflow               tracking server, between the client and the two stores
#
# Tutorial: https://mlflow.org/docs/latest/ml/tracking/tutorials/remote-server/
# Deviation: the tracking server is containerized rather than run on the host,
# so the whole stack starts with one command.
#
#   cp .env.example .env
#   docker compose up -d --wait    # start, and wait for healthchecks
#   docker compose down            # stop; data persists in the named volumes
#   docker compose down -v         # stop and wipe the volumes

# A per-lab project name. Without it Compose uses the directory name
# ("starter"), which every lab in this course shares — and so would their
# containers and volumes.
name: week02-local-services-starter

services:

  # ── Postgres: relational backend store ─────────────────────────────────────
  # Experiment names, run IDs, params, metrics, tags. Image pinned.
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5532}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MinIO: S3-compatible object store ──────────────────────────────────────
  # TODO(student) — Exercise 1:
  # Fill in the MinIO service definition below.
  # Requirements:
  #   - Use image: minio/minio:RELEASE.2024-06-13T22-53-53Z  (pinned version)
  #   - Pass MINIO_ROOT_USER and MINIO_ROOT_PASSWORD from environment
  #   - command: server /data --console-address ":9001"
  #   - Expose port 9000 (S3 API) and 9001 (web console) to the host
  #     (host ports are remapped: MINIO_API_PORT=5510 → 9000, MINIO_CONSOLE_PORT=5511 → 9001)
  #   - Mount a named volume "minio-data" to /data
  #   - Add a healthcheck that uses:
  #       test: ["CMD-SHELL", "mc ready local || exit 1"]
  #       interval: 5s, timeout: 5s, retries: 10
  #     (mc is bundled with the minio/minio image)
  # After filling this in, run:
  #   docker compose up -d minio
  # Then open http://localhost:5511 and log in with your .env credentials.
  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${S3_API_PORT:-5510}:9000"
      - "${S3_CONSOLE_PORT:-5511}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── minio-create-bucket: one-shot bucket initialisation ────────────────────
  # TODO(student) — Exercise 1 (continued):
  # Fill in the bucket-creation job below.
  # Requirements:
  #   - Use image: minio/mc:RELEASE.2025-08-13T08-35-41Z  (pinned version)
  #   - depends_on: minio: condition: service_healthy
  #   - The entrypoint should run:
  #       mc alias set minio http://minio:9000 <user> <password> &&
  #       mc mb --ignore-existing minio/<bucket>
  #     Use shell variable substitution or reference env vars directly.
  # After the bucket is created, confirm it appears in the MinIO console.
  minio-create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      bash -c "
        mc alias set minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing minio/${MINIO_BUCKET}
      "

  # ── MLflow tracking server ──────────────────────────────────────────────────
  # TODO(student) — Exercise 2: fill in the empty values of the mlflow service.
  #   - environment: the server, not your Python client, stores the artifacts in
  #     Silo. Give it Silo's S3 endpoint inside the compose network, and the
  #     Silo keys from .env under the AWS_* names the S3 library reads.
  #   - --backend-store-uri: a PostgreSQL connection URI built from the
  #     POSTGRES_* values in .env. Use the service name as the hostname, and
  #     the container port, not the host port.
  #   - --artifacts-destination: the bucket from Exercise 1, as an s3:// URI.
  #   - --allowed-hosts: the names the server is reached by: localhost,
  #     127.0.0.1 and mlflow. The check compares the whole Host header, port
  #     included, so allow each name with any port as well.
  # Tutorial: https://mlflow.org/docs/latest/ml/tracking/tutorials/remote-server/
  # Allowed hosts: https://mlflow.org/docs/latest/self-hosting/security/network/
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command:
      - --backend-store-uri
      - postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --artifacts-destination
      - s3://${MINIO_BUCKET}
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --allowed-hosts
      # NOTE: MLflow's host check does NOT strip the port, so you must allow the
      # host:port form. The "host:*" wildcard accepts any port.
      - "localhost,127.0.0.1,mlflow,localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "${MLFLOW_PORT:-5500}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
